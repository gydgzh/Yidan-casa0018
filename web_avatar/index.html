<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Face Mocap → Avatar (head close-up)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { margin:0; height:100%; background:#1a1c20; color:#eee;
                font:13px/1.4 ui-monospace,Menlo,Consolas,monospace; }
    #c       { width:100%; height:100%; display:block; }
    #hud     { position:fixed; top:10px; left:10px; padding:8px 12px;
               background:rgba(0,0,0,.55); border-radius:8px; max-width:380px; }
    #hud b   { color:#7ee787; }
    #hud .err{ color:#f85149; }
    #hud hr  { border:none; border-top:1px dashed #444; margin:6px 0; }
    label    { user-select:none; cursor:pointer; }
    select   { font: inherit; padding:2px 6px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; }
    .tag     { display:inline-block; padding:1px 6px; border-radius:4px; background:#222; color:#9bd1ff; }
    #actEvt  { color:#ffd166; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>
      avatar:
      <select id="avatarSel" onchange="
        const u=new URL(location.href); u.searchParams.set('model', this.value); location.href=u.toString();
      ">
        <option value="brunette">Brunette</option>
        <option value="blonde">Blonde</option>
        <option value="asian">Asian</option>
      </select>
    </div>
    <hr/>
    <div>relay:<b id="ws">…</b>  fps:<b id="fps">0</b>  blendshapes:<b id="bs">0</b></div>
    <div><label><input type="checkbox" id="smooth" checked> One-Euro 平滑</label>
         &nbsp;<label><input type="checkbox" id="head"   checked> 头部跟随</label></div>
    <hr/>
    <div>action:<span class="tag" id="actLbl">…</span>
         conf:<b id="actCnf">—</b>
         &nbsp;<label><input type="checkbox" id="actOn" checked> 动作识别开</label></div>
    <div>last triggered: <span id="actEvt">—</span></div>
    <hr/>
    <div id="warn" class="err"></div>
  </div>
  <script>
    // sync dropdown to ?model= param
    const _q = new URLSearchParams(location.search);
    const _sel = document.getElementById('avatarSel');
    if (_sel && _q.get('model')) _sel.value = _q.get('model');
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
